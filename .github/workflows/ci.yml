# CI (CPU runners only; no GPU or CUDA executable is run).
# python: Run analysis tests and the NumPy FFT reference tests on Python 3.12.
# shell: Check all scripts with bash/shellcheck and dry-run the T1 pipeline.
# cuda-compile: Build fft2 for sm_80/sm_89, and measurement tools on CUDA 13.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            .github/workflows/ci.yml
            scripts/analysis/requirements.txt
      - name: Analysis tests
        shell: bash
        run: |
          if [[ -d tests ]]; then
            pip install -r scripts/analysis/requirements.txt pytest
            pytest tests -q
          else
            echo "::notice::tests/ is absent; skipping analysis tests."
          fi
      - name: FFT reference tests
        shell: bash
        run: |
          if [[ -d fft2/reference ]]; then
            pip install numpy pytest
            pytest fft2/reference -q
          else
            echo "::notice::fft2/reference/ is absent; skipping reference tests."
          fi

  shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Bash syntax and ShellCheck
        shell: bash
        run: |
          scripts=()
          if [[ -d scripts ]]; then
            mapfile -d '' -t scripts < <(find scripts -type f -name '*.sh' -print0)
          fi
          if ((${#scripts[@]} == 0)); then
            echo "::notice::No scripts/*.sh files found; skipping shell checks."
            exit 0
          fi
          # Older runner versions misidentify trap callbacks as unreachable (SC2317).
          # Pin the upstream release so checks match local validation.
          curl -fsSL --retry 3 \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            -o "$RUNNER_TEMP/shellcheck.tar.xz"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          shellcheck="$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck"
          "$shellcheck" --version
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
          "$shellcheck" --external-sources "${scripts[@]}"
      - name: T1 full and quick dry-runs
        shell: bash
        run: |
          if [[ -f scripts/run_t1_all.sh ]]; then
            scripts/run_t1_all.sh --tag ci --dry-run
            scripts/run_t1_all.sh --tag ci --quick --dry-run
          else
            echo "::notice::scripts/run_t1_all.sh is absent; skipping T1 dry-runs."
          fi

  cuda-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: nvidia/cuda:13.0.2-devel-ubuntu24.04
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # Install git before checkout so submodule initialization has a Git worktree.
      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends build-essential ca-certificates git libfftw3-dev
      - uses: actions/checkout@v6
      - name: Build fft2 (sm_80, warnings as errors)
        run: |
          if [[ -d fft2 ]]; then
            make -C fft2 CUDA_ARCH=sm_80
          else
            echo "::notice::fft2/ is absent; skipping the sm_80 build."
          fi
      - name: Build fft2 (sm_89, warnings as errors)
        run: |
          if [[ -d fft2 ]]; then
            make -C fft2 CUDA_ARCH=sm_89
          else
            echo "::notice::fft2/ is absent; skipping the sm_89 build."
          fi
      - name: Build measurement tools (sm_80)
        run: |
          if [[ -d bench ]]; then
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            git submodule update --init third_party/VkFFT
            make bench tools TAG=ci CUDA_ARCH=sm_80
          else
            echo "::notice::bench/ is absent; skipping VkFFT and measurement tool builds."
          fi

