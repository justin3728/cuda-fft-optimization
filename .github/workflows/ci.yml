# CI (CPU runners only; no GPU or CUDA executable is run).
# python: Run analysis tests and the NumPy FFT reference tests on Python 3.12.
# shell: Check all scripts with bash/shellcheck and dry-run the T1 pipeline.
# cuda-compile: Build fft2 for sm_80/sm_89, measurement tools, and legacy on CUDA 13.
# notebooks: Validate notebook JSON/schema and warn about outputs over 1 MB.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            .github/workflows/ci.yml
            scripts/analysis/requirements.txt
      - name: Analysis tests
        shell: bash
        run: |
          if [[ -d tests ]]; then
            pip install -r scripts/analysis/requirements.txt pytest
            pytest tests -q
          else
            echo "::notice::tests/ is absent; skipping analysis tests."
          fi
      - name: FFT reference tests
        shell: bash
        run: |
          if [[ -d fft2/reference ]]; then
            pip install numpy pytest
            pytest fft2/reference -q
          else
            echo "::notice::fft2/reference/ is absent; skipping reference tests."
          fi

  shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax and ShellCheck
        shell: bash
        run: |
          scripts=()
          if [[ -d scripts ]]; then
            mapfile -d '' -t scripts < <(find scripts -type f -name '*.sh' -print0)
          fi
          if ((${#scripts[@]} == 0)); then
            echo "::notice::No scripts/*.sh files found; skipping shell checks."
            exit 0
          fi
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends shellcheck
          fi
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
          shellcheck --external-sources "${scripts[@]}"
      - name: T1 full and quick dry-runs
        shell: bash
        run: |
          if [[ -f scripts/run_t1_all.sh ]]; then
            scripts/run_t1_all.sh --tag ci --dry-run
            scripts/run_t1_all.sh --tag ci --quick --dry-run
          else
            echo "::notice::scripts/run_t1_all.sh is absent; skipping T1 dry-runs."
          fi

  cuda-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: nvidia/cuda:13.0.2-devel-ubuntu24.04
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # Install git before checkout so submodule initialization has a Git worktree.
      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends build-essential ca-certificates git libfftw3-dev
      - uses: actions/checkout@v4
      - name: Build fft2 (sm_80, warnings as errors)
        run: |
          if [[ -d fft2 ]]; then
            make -C fft2 CUDA_ARCH=sm_80
          else
            echo "::notice::fft2/ is absent; skipping the sm_80 build."
          fi
      - name: Build fft2 (sm_89, warnings as errors)
        run: |
          if [[ -d fft2 ]]; then
            make -C fft2 CUDA_ARCH=sm_89
          else
            echo "::notice::fft2/ is absent; skipping the sm_89 build."
          fi
      - name: Build measurement tools (sm_80)
        run: |
          if [[ -d bench ]]; then
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            git submodule update --init third_party/VkFFT
            make bench tools TAG=ci CUDA_ARCH=sm_80
          else
            echo "::notice::bench/ is absent; skipping VkFFT and measurement tool builds."
          fi
      - name: Build legacy (sm_80)
        run: make -B CUDA_ARCH=sm_80

  notebooks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      - name: Install notebook validator
        run: pip install nbformat
      - name: Validate notebook JSON, schema, and stored output size
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import nbformat

          paths = sorted(Path("notebooks").glob("*.ipynb"))
          if not paths:
              print("::notice::No notebooks/*.ipynb files found; skipping notebook checks.")
          for path in paths:
              notebook = nbformat.read(path, as_version=nbformat.NO_CONVERT)
              nbformat.validate(notebook)
              output_bytes = sum(
                  len(json.dumps(cell.get("outputs", []), ensure_ascii=False).encode("utf-8"))
                  for cell in notebook.cells
              )
              print(f"{path}: valid notebook; {output_bytes:,} bytes of stored outputs")
              if output_bytes > 1_000_000:
                  print(
                      f"::warning file={path}::Stored outputs total {output_bytes:,} bytes "
                      "(over 1 MB); consider clearing outputs before committing."
                  )
          PY
